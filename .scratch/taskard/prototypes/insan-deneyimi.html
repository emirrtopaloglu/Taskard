<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskard — Koşu Deneyimi (Açıklayıcı Telegraf)</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#7d8590;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.65 var(--mono); padding:24px; }
  header { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 auto 0 0; color:var(--dim); font-weight:normal; }
  button { background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-family:var(--mono); }
  button:hover { border-color:var(--blue); color:var(--blue); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; max-width:860px; min-height:440px; }
  p.ev { margin:0 0 10px; white-space:pre-wrap; }
  p.dim{color:var(--dim)} .ok{color:var(--green)} .err{color:var(--red)}
  .warn{color:var(--amber)} .info{color:var(--ink)}
  .ts { color:var(--dim); margin-right:10px; }
</style>
</head>
<body>
<header>
  <h1>taskard koşu anlatımı — açıklayıcı telegraf (ana agent sesiyle)</h1>
  <button id="step">adım →</button>
  <button id="play">▶ oynat</button>
  <button id="reset">sıfırla</button>
</header>
<div class="card" id="stage"></div>
<script>
const EV = [
  {c:"warn", m:"Görevini aldım. Önce doğruladım: roadmap üretimi ayrı bir AI çağrısıymış, senin istediğin şeyse mevcut plana MATERYAL eklemek. Spec'i buna göre yazdım."},
  {c:"warn", m:"Tek karar noktası vardı — roadmap'in yeniden üretilip üretilmeyeceği. Sordum, 'sadece materyal ekle' dedin. Spec kesinleşti: storage + materials tablosu + RAG index; DeepSeek çağrısı yok."},
  {c:"info", m:"Tek lane yeterli dedim çünkü adımlar sıralı bağımlı (backend → frontend); paralellik burada fayda değil risk."},
  {c:"info", m:"Brief'i yazdım: spec'in tamamına referans + sıralı adımlar + kapsam dışı listesi. Brief'in kalitesi delegate'in tavanı — oraya yatırım yaptım."},
  {c:"info", m:"INDEX.md'e işledim ve implementer'ı (sonnet) kendi lane'inde başlattım. Şimdi onun raporunu bekliyorum."},
  {c:"ok",   m:"Implementer bitirdi — 3 commit: shared refactoring, yeni Edge Function (auth + sahiplik + boyut limiti dahil), UI butonu. tsc/eslint temiz. Commit listesini kendim doğruladım, iddia ile disk aynı."},
  {c:"info", m:"Şimdi kaliteyi TAZE gözle kontrol ettiriyorum: yeni bir reviewer (opus) açtım — implementer ile hiç context paylaşmıyor, sadece diff + spec bakıyor."},
  {c:"warn", m:"Reviewer geri döndü: PASS_WITH_NOTES. Tek bulgu Minor — materyal ekleme hatasında yanlış toast başlığı kullanılmış (plan oluşturma hatası metni sızmış)."},
  {c:"ok",   m:"Düzeltmeyi kendim yapmıyorum — yeni bir implementer delegate'i açtım, sadece o satırı verdim. 30 saniyede kapattı."},
  {c:"ok",   m:"Bağımsız kontrolü yaptım: diff'te gerçekten sadece toast başlığı değişmiş. Minor bulgu olduğu için ikinci tam review gerekmedi, kanıt yeterli."},
  {c:"ok",   m:"KAPANIŞ: 4 commit local main'de hazır, push kararı sende. Ayrıntılı tablo aşağıda — Yapıldı · Sonraki: push · Engel: yok."}
];
let i=0, timer=null;
const stage=document.getElementById("stage");
function ts(n){ return String(19+(n*0.4|0)).padStart(2,"0")+":"+String((n*24)%60).padStart(2,"0"); }
function render(){
  stage.innerHTML = EV.slice(0,i).map((e,n)=>
    "<p class='ev "+e.c+"'><span class='ts'>"+ts(n)+"</span>"+e.m+"</p>").join("") +
    (i<EV.length ? "<p class='ev dim'>▍</p>" : "");
}
function step(){ if(i>=EV.length){stop();return;} i++; render(); }
function stop(){ if(timer){clearInterval(timer);timer=null;} }
document.getElementById("step").onclick=step;
document.getElementById("play").onclick=()=>{ if(timer)return stop(); timer=setInterval(step,1600); };
document.getElementById("reset").onclick=()=>{ stop(); i=0; render(); };
render();
</script>
</body>
</html>
