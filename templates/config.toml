[defaults]
permission_mode = "bypassPermissions"
report_max_lines = 15
max_attempts = 2
# budget_minutes = 30   # opsiyonel: lane başına zaman tavanı (graph modunda önerilir)

[roles]
planner = "opus"
implementer = "sonnet"
reviewer = "opus"
qa-tester = "sonnet"
explorer = "haiku"
# İstemediğin rollerin lane'i hiç açılmaz; iş en yakın yetkili ele düşer (SKILL.md §3 Lane + delegate).
# Proje listesi (.taskard/config.toml) bu listeyi komple değiştirir; oturumdaki sözlerin ikisini de geçer.
# Örnek: disabled = ["debugger", "qa-tester"]
disabled = []

[harness_preferences]
# limit dolunca tercih sirasi (opsiyonel):
# implementer = ["claude", "codex", "opencode"]

[risky_operations]
patterns = ["migration", "deploy", "rm -rf", "drop table", "git push --force"]
