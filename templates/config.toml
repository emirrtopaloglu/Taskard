[defaults]
permission_mode = "bypassPermissions"
default_mode = "pro"        # "fast" | "pro" (default) | "max"
report_max_lines = 15
max_attempts = 2            # 2-Strike rule: max 1 retry attempt, halt on 2nd failure
# budget_minutes = 30       # optional: time ceiling per lane (recommended in max mode)

[roles]
# Pro Mode Defaults (Tier 2 Fast & Balanced):
implementer = "sonnet"
ui-developer = "sonnet"
reviewer = "sonnet"         # Scoped mini-review for Pro mode
debugger = "sonnet"         # Targeted bug fixing for Pro mode

# Max Mode Heavy Brains (Tier 1 Strategy, Architecture & Deep Security):
planner = "opus"
reviewer_max = "opus"       # Deep architectural & security review for Max mode
debugger_max = "opus"       # Complex root-cause diagnosis for Max mode

# Tier 3: Light & Fast (Exploration & Verification):
# Note: Model names vary by harness; Tier 3 is the fastest/lightest model in that harness.
explorer = "haiku"
qa-tester = "haiku"

# Disabled roles never receive lanes; work falls back to nearest capable role.
# Project-level config (.taskard/config.toml) overrides global; session prompts override both.
disabled = []

[qa]
# QA role headless testing capabilities (default OFF)
# Activated when configured here or requested in session prompt (e.g. "QA verify in browser")
enabled = false
headless_browser = false       # UI verification with agent-browser or playwright-cli
run_integration_tests = false  # Test suite execution (npm test, pytest, etc.)
auto_verify_endpoints = false  # HTTP API response verification via curl

[harness_preferences]
# Fallback preference order when rate limits occur (optional):
# implementer = ["claude", "codex", "opencode"]

[risky_operations]
patterns = ["migration", "deploy", "rm -rf", "drop table", "git push --force"]
