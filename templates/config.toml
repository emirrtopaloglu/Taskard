# Agent-read preferences. Taskard does not mutate this file at runtime.
# See harness-profiles.json for capability and model-inheritance declarations.

[defaults]
permission_mode = "bypassPermissions" # Harness-specific preference; not a cross-harness safety guarantee.
default_mode = "pro"                  # "fast" | "pro" | "max"
report_max_lines = 15
max_attempts = 2                       # Total fix attempts: first attempt plus at most one retry.
max_parallel = 3                       # Concurrent writer lanes per wave; reviewer, explorer, and QA do not count.
# budget_minutes = 30                  # Optional estimate ceiling for a lane.

[roles]
# These names are model aliases, not fixed provider model IDs.
implementer = "sonnet"
ui-developer = "sonnet"
reviewer = "sonnet"
debugger = "sonnet"
planner = "opus"
reviewer_max = "opus"
debugger_max = "opus"
explorer = "haiku"
qa-tester = "haiku"

# Disabled roles are not assigned lanes; choose a capable named role instead.
disabled = []

[qa]
# QA runs only when enabled and the required environment is available.
enabled = false
headless_browser = false
run_integration_tests = false
auto_verify_endpoints = false

[harness_preferences]
# Manual preferences only; Taskard performs no automatic or paid harness fallback.
# primary_harness = "claude-code" # optional: "claude-code" | "opencode" | "codex"

# Optional Claude Code role model aliases:
[harness_preferences.models.claude_code]
# reviewer = "sonnet"

# Optional OpenCode role models must use provider/model; absent entries inherit
# the model from OpenCode's selected provider.
[harness_preferences.models.opencode]
# reviewer = "provider/model"

[risky_operations]
# Agent-read prompts, not runtime-enforced blocks. Follow the active harness permissions.
patterns = ["migration", "deploy", "rm -rf", "drop table", "git push --force"]
