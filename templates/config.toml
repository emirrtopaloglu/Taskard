[defaults]
permission_mode = "bypassPermissions"
default_mode = "express"    # "nano" | "express" (varsayılan) | "full"
report_max_lines = 15
max_attempts = 2            # 2-Strike kuralı: 1 düzeltme denemesi, 2. hatada derhal insana eskalasyon
# budget_minutes = 30       # opsiyonel: lane başına zaman tavanı (full modunda önerilir)

[roles]
# Express Mod Varsayılanları (Tier 2 Hızlı & Dengeli):
implementer = "sonnet"
ui-developer = "sonnet"
reviewer = "sonnet"         # Express modda scoped mini-review için sonnet
debugger = "sonnet"         # Express modda hedefli hata teşhisi için sonnet

# Full Mod Ağır Beyinleri (Tier 1 Strateji, Mimari & Derin Güvenlik):
planner = "opus"
reviewer_full = "opus"      # Full modda mimari & güvenlik incelemesi
debugger_full = "opus"      # Full modda karmaşık/flaky kök neden analizi

# Tier 3: Işık Hızında Asistanlar (Geniş Keşif & Hızlı Doğrulama):
# Not: model adları harness'a göre değişir; Tier 3 = o harness'ta karşılığı olan en ucuz/hızlı model.
explorer = "haiku"
qa-tester = "haiku"

# İstemediğin rollerin lane'i hiç açılmaz; iş en yakın yetkili ele düşer.
# Proje listesi (.taskard/config.toml) bu listeyi komple değiştirir; oturumdaki sözlerin ikisini de geçer.
disabled = []

[qa]
# QA rolünün headless test yetenekleri (varsayılan KAPALI)
# Oturumda "QA tarayıcıda doğrulasın" dendiğinde veya burada true yapıldığında devreye girer
enabled = false
headless_browser = false       # agent-browser / playwright-cli ile UI doğrulaması
run_integration_tests = false  # test suite (npm test, pytest vb.) çalıştırma
auto_verify_endpoints = false  # curl / HTTP API yanıt doğrulaması

[harness_preferences]
# Limit dolunca tercih sırası (opsiyonel):
# implementer = ["claude", "codex", "opencode"]

[risky_operations]
patterns = ["migration", "deploy", "rm -rf", "drop table", "git push --force"]
